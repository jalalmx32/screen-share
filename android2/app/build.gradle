apply plugin: 'com.android.application'

android {
    namespace 'com.screenshare.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.screenshare.app"
        minSdk 26
        targetSdk 34
        versionCode 30
        versionName "3.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
